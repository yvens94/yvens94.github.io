<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jean Yvens Alberus — Blog</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <header>
    <div class="container">
      <a href="index.html" class="logo" id="header-name">Jean Yvens Alberus</a>
      <nav>
        <a href="index.html" class="nav-active">Blog</a>
        <a href="about.html">About</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <section id="blog">
    <div class="container">
      <h2>Blog</h2>
      <div id="post-list"><div class="no-posts" style="opacity:0.5;">Loading…</div></div>
    </div>
  </section>

  <footer>
    <div class="container">
      &copy; <span id="year"></span> Jean Yvens Alberus
    </div>
  </footer>

  <!-- Post Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="post-meta" id="modal-date"></div>
      <h1 id="modal-title"></h1>
      <div class="prose" id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // load display name from bio (still local — bio editing is admin-only)
    const storedBio = JSON.parse(localStorage.getItem('jya_bio') || 'null');
    if (storedBio && storedBio.name) {
      document.getElementById('header-name').textContent = storedBio.name;
      document.title = storedBio.name + ' — Blog';
    }

    let allPosts = [];

    async function loadPosts() {
      try {
        const res = await fetch('posts.json?t=' + Date.now());
        if (!res.ok) throw new Error('fetch failed');
        allPosts = await res.json();
      } catch {
        allPosts = [];
      }
      renderPosts();
    }

    function fmtDate(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    }

    function plainText(md) {
      return md.replace(/[#*`>\-\[\]()!]/g, '').replace(/\n+/g, ' ').trim();
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderPosts() {
      const posts = allPosts.slice().sort((a, b) => b.date.localeCompare(a.date));
      const el = document.getElementById('post-list');
      if (!posts.length) {
        el.innerHTML = '<div class="no-posts">No posts yet.</div>';
        return;
      }
      el.innerHTML = posts.map(p => `
        <div class="post-card" onclick="openPost('${escHtml(p.id)}')">
          <div class="post-date">${fmtDate(p.date)}</div>
          <h3>${escHtml(p.title)}</h3>
          <div class="post-excerpt">${escHtml(plainText(p.body).slice(0, 180))}</div>
        </div>
      `).join('');
    }

    function openPost(id) {
      const post = allPosts.find(p => p.id === id);
      if (!post) return;
      document.getElementById('modal-date').textContent = fmtDate(post.date);
      document.getElementById('modal-title').textContent = post.title;
      document.getElementById('modal-body').innerHTML = marked.parse(post.body);
      document.getElementById('modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    document.getElementById('modal-close').onclick = closeModal;
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    loadPosts();
  </script>
</body>
</html>
